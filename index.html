<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRX // Painel WhatsApp</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121216;
            --text-color: #f3f4f6;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.3);
        }

        body[data-theme="blue"] {
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
        }
        body[data-theme="green"] {
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.3);
        }
        body[data-theme="crimson"] {
            --accent-color: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .app-header h1 {
            color: var(--accent-color);
            text-shadow: 0 0 12px var(--accent-glow);
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .status-online {
            color: var(--accent-color);
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 25px var(--accent-glow);
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .form-group input {
            background: var(--bg-color);
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .action-btn {
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: opacity 0.2s, transform 0.1s;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            margin-top: 15px;
        }

        .target-display {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .target-display span {
            color: var(--text-color);
            font-weight: bold;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--bg-color);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #374151;
            margin-bottom: 6px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.2s ease;
        }

        #progress-percentage {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .terminal-logs {
            background: var(--bg-color);
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #10b981;
            margin-bottom: 15px;
        }

        .terminal-logs p {
            margin-bottom: 4px;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.2s;
            z-index: 100;
        }

        .settings-btn:hover {
            transform: scale(1.1);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .modal-content h3 {
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .modal-content p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .color-options {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
        }

        .color-picker {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-picker:hover {
            transform: scale(1.15);
        }

        .close-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body data-theme="purple">

    <button id="settings-btn" class="settings-btn" aria-label="Configurações">⚙️</button>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Configurações</h3>
            
            <p>Escolha a cor de destaque:</p>
            <div class="color-options">
                <button class="color-picker" data-color="purple" style="background-color: #8b5cf6;" title="Roxo"></button>
                <button class="color-picker" data-color="blue" style="background-color: #3b82f6;" title="Azul"></button>
                <button class="color-picker" data-color="green" style="background-color: #10b981;" title="Verde"></button>
                <button class="color-picker" data-color="crimson" style="background-color: #ef4444;" title="Vermelho"></button>
            </div>

            <button id="close-modal" class="close-btn">Fechar</button>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <h1>ZRX // WhatsApp</h1>
            <p>Status: <span class="status-online">Online</span></p>
        </header>

        <!-- TELA 1: Input -->
        <main id="input-screen" class="app-main">
            <div class="card">
                <h2>Painel WhatsApp</h2>
                <div class="form-group">
                    <label for="target-input">Digite o número (Ex: 55629...)</label>
                    <input type="text" id="target-input" placeholder="5562999999999">
                </div>
                <button id="confirm-btn" class="action-btn">Confirmar Disparo</button>
            </div>
        </main>

        <!-- TELA 2: Progresso até 2000 -->
        <main id="progress-screen" class="app-main hidden">
            <div class="card">
                <h2>Enviando requisições</h2>
                <p class="target-display">ALVO <span id="display-number">--</span></p>
                
                <div class="progress-bar-container">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <span id="progress-percentage">0%</span>

                <div class="terminal-logs" id="terminal-logs">
                    <p>> Conectando à API banzap.com.br...</p>
                </div>

                <button id="back-btn" class="action-btn secondary-btn hidden">Nova Operação</button>
            </div>
        </main>
    </div>

    <script>
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeModal = document.getElementById('close-modal');
        const colorPickers = document.querySelectorAll('.color-picker');
        const body = document.body;

        const inputScreen = document.getElementById('input-screen');
        const progressScreen = document.getElementById('progress-screen');
        const targetInput = document.getElementById('target-input');
        const confirmBtn = document.getElementById('confirm-btn');
        const displayNumber = document.getElementById('display-number');
        const progressFill = document.getElementById('progress-fill');
        const progressPercentage = document.getElementById('progress-percentage');
        const terminalLogs = document.getElementById('terminal-logs');
        const backBtn = document.getElementById('back-btn');

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeModal.addEventListener('click', () => settingsModal.classList.add('hidden'));
        window.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.add('hidden');
        });

        colorPickers.forEach(picker => {
            picker.addEventListener('click', () => {
                const theme = picker.getAttribute('data-color');
                body.setAttribute('data-theme', theme);
                localStorage.setItem('zrx-theme', theme);
            });
        });

        const savedTheme = localStorage.getItem('zrx-theme');
        if (savedTheme) body.setAttribute('data-theme', savedTheme);

        confirmBtn.addEventListener('click', () => {
            const numero = targetInput.value.trim();

            if (!numero) {
                alert('Por favor, insira o número.');
                return;
            }

            displayNumber.textContent = '+' + numero;
            inputScreen.classList.add('hidden');
            progressScreen.classList.remove('hidden');

            iniciarDisparoEmLote(numero);
        });

        function iniciarDisparoEmLote(numero) {
            let count = 1;
            const maxCount = 2000;
            const apiUrl = "https://banzap.com.br/index.html";

            terminalLogs.innerHTML = `<p>> Conectando em ${apiUrl}...</p>`;
            progressFill.style.width = '0%';
            progressPercentage.textContent = '0%';
            backBtn.classList.add('hidden');

            const timer = setInterval(() => {
                if (count <= maxCount) {
                    // Adiciona o log no formato solicitado
                    terminalLogs.innerHTML += `<p>[${count}] REPORTADO COM SUCESSO✅️</p>`;
                    
                    // Atualiza a barra de progresso baseada em 2000
                    let percent = Math.floor((count / maxCount) * 100);
                    progressFill.style.width = percent + '%';
                    progressPercentage.textContent = percent + '%';

                    terminalLogs.scrollTop = terminalLogs.scrollHeight;
                    count++;
                } else {
                    clearInterval(timer);
                    terminalLogs.innerHTML += `<p style="color: #3b82f6;">> [CONCLUÍDO] Todos os 2000 disparos efetuados!</p>`;
                    backBtn.classList.remove('hidden');
                }
            }, 10); // Velocidade rápida para preencher até 2000
        }

        backBtn.addEventListener('click', () => {
            targetInput.value = '';
            progressScreen.classList.add('hidden');
            inputScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
